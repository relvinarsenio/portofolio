      }

      .accent {
        fill: #63B3C8;
      }

      .rule {
        stroke: #29313B;
        stroke-width: 1;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#101419"/>

  <!-- Header -->
  <g class="sans">
