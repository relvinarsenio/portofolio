    <text x="154" y="383" class="subtle">/</text>
    <text x="170" y="383" class="accent">O_DIRECT</text>
    <text x="252" y="383" class="subtle">/</text>
    <text x="268" y="383" class="accent">Hyper-V NVMe</text>
    <text x="389" y="383" class="subtle">/</text>
